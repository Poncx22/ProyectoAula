<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${factura.idF == null || factura.idF == 0 ? 'Nueva Factura' : 'Editar Factura'}"></title>
    <link rel="stylesheet" type="text/css" th:href="@{'/css/estilos.css'}">
</head>
<body>
     <header>
        <nav class="navbar">
             <img src="/imgs/logo_header.png" alt="Logo GasTroTec" class="logoGsTc">
             <div class="logo">GASTROTEC</div>
             <ul class="nav-links">
                 <li><a href="/CLIENTES">CLIENTES</a></li>
                 <li><a href="/TRABAJADORES">TRABAJADORES</a></li>
                 <li><a href="/PRODUCTOS">PRODUCTOS</a></li>
                 <li><a href="/INVENTARIO">INVENTARIO</a></li>
                 <li><a href="/PROVEEDORES">PROVEEDORES</a></li>
                 <li><a href="/VENTAS">VENTAS</a></li>
                 <li><a href="/COMPROBANTES" class="active">COMPROBANTES</a></li>
             </ul>
        </nav>
    </header>

    <!---->
    <h1 th:text="${factura.idF == null || factura.idF == 0 ? 'Registrar factura' : 'Editar factura'}"></h1>

    <form th:action="@{/facturas}" th:object="${factura}" method="post">
    <div th:if="${factura.idF != 0}">
        <label>ID:</label>
        <input type="text" th:field="*{idF}" readonly/><br> 
    </div>
    <input type="hidden" th:field="*{idF}" th:if="${factura.idF != 0}" />

    <label>Fecha:</label>
    <input type="date" th:field="*{fechaF}" required/><br>

    <label>Método de Pago:</label>
    <input type="text" th:field="*{metodoPagoF}" required/><br>

    <label>Subtotal:</label>
    <input type="number" step="0.01" th:field="*{subTotalF}" required/><br>

    <label>Impuestos:</label>
    <input type="number" step="0.01" th:field="*{impuestosF}" required/><br>

    <label>Propina:</label>
    <input type="number" step="0.01" th:field="*{propinaF}" required/><br>

    <label>Descuento:</label>
    <input type="number" step="0.01" th:field="*{descuentoF}" required/><br>

    <!-- For simplicity, total can be calculated, but for now, input it -->
    <label>Total:</label>
    <input type="number" step="0.01" th:field="*{totalF}" required/><br>

    <!-- You may need to add selects for Pedido, Cliente, Trabajador, but for now, leave as is -->

    <button type="submit" th:text="${factura.idF == null || factura.idF == 0 ? 'Guardar' : 'Actualizar'}"></button>
    </form>

    <a href="/facturas">⬅ Volver</a>
    <footer>
        <div class="footer-content">
            <p>© 2025 GasTroTec | Todos los derechos reservados</p>
            <p class="footer-links">
                <a href="/terminos">Términos</a> |
                <a href="/privacidad">Privacidad</a> |
                <a href="/contacto">Contacto</a>
            </p>
        </div>
    </footer>
</body>
</html>
