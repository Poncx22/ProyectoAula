<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${producto.idProd == null || producto.idProd == 0 ? 'Nuevo producto' : 'Editar producto'}"></title>
    <link rel="stylesheet" type="text/css" th:href="@{'/css/estilos.css'}">
</head>
<body>
     <header>
        <nav class="navbar">
             <img src="/imgs/logo_header.png" alt="Logo GasTroTec" class="logoGsTc">
             <div class="logo">GASTROTEC</div>
             <ul class="nav-links">
                 <li><a href="/CLIENTES">CLIENTES</a></li>
                 <li><a href="/TRABAJADORES">TRABAJADORES</a></li>
                 <li><a href="/PRODUCTOS"class="active" >PRODUCTOS</a></li>
                 <li><a href="/INVENTARIO">INVENTARIO</a></li>
                 <li><a href="/PROVEEDORES">PROVEEDORES</a></li>
                 <li><a href="/VENTAS">VENTAS</a></li>
                 <li><a href="/COMPROBANTES ">COMPROBANTES</a></li>
             </ul>
        </nav>
    </header>

    <h1 th:text="${producto.idProd == null || producto.idProd == 0 ? 'Registrar producto' : 'Editar producto'}"></h1>


    <form th:action="@{/productos}" th:object="${producto}" method="post">
    <div th:if="${producto.idProd != 0}">
        <label>ID:</label>
        <input type="text" th:field="*{idProd}" readonly/><br> 
    </div>
    <input type="hidden" th:field="*{idProd}" th:if="${producto.idProd != 0}" />


    <label>Código:</label>
    <input type="text" th:field="*{codigoProd}" required/><br> <label>Nombre:</label>
    <input type="text" th:field="*{nombreProd}" required/><br>
    
    <label>Precio:</label>
    <input type="number" step="0.01" th:field="*{precioProd}" required/><br> <label>Categoría:</label>
    <input type="text" th:field="*{categoriaProd}" required/><br>

    <button type="submit" th:text="${producto.idProd == null || producto.idProd == 0 ? 'Guardar' : 'Actualizar'}"></button>
    </form>


    <a href="/productos">⬅ Volver</a>
    <footer>
        <div class="footer-content">
            <p>© 2025 GasTroTec | Todos los derechos reservados</p>
            <p class="footer-links">
                <a href="/terminos">Términos</a> |
                <a href="/privacidad">Privacidad</a> |
                <a href="/contacto">Contacto</a>
            </p>
        </div>
    </footer>
</body>
</html>
